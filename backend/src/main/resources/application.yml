server:
  port: ${PORT:8082}
  servlet:
    context-path: /api
  # Serve static resources (CSS, JS, images) from classpath:/static/
  # This makes /assets/* serve from static/assets/, etc.
  error:
    whitelabel:
      enabled: false

spring:
  # Local dev: load backend/.env (MAIL_*, DATABASE_*, ...) as properties. Real env vars still win.
  config:
    import: optional:file:.env[.properties]
  application:
    name: interview-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      # Railway Redis provides REDIS_URL (redis://default:pass@host:port). Falls back to localhost.
      url: ${REDIS_URL:redis://localhost:6379}
  datasource:
    # DBURL must be a JDBC url (jdbc:postgresql://host:port/db). Falls back to localhost for local dev.
    # Do not use Railway's raw DATABASE_URL (postgresql://...); the JDBC driver rejects it.
    url: ${DBURL:jdbc:postgresql://localhost:5432/interviewdb}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:1998}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      # Hibernate owns the schema — creates the questions table from the entity if missing (idempotent).
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    com.interview.backend: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  # This backend's own public origin (no trailing slash). Uploaded images are served
  # back via {public-base-url}/api/images/file/**, so the S3 bucket can stay private.
  # On Railway set APP_PUBLIC_BASE_URL to the backend's public URL (https://...up.railway.app).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8082}
  # Topics readable without an account; everything else requires sign-up.
  # These stay crawlable so search engines still index a sample of the content.
  free-techs: ${FREE_TECHS:microservices,design-patterns}
  s3:
    # LocalStack for local dev; override with real AWS/Railway values in prod.
#    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
#    region: ${AWS_REGION:us-east-1}
#    bucket: ${AWS_S3_BUCKET:blog-images}
#    access-key: ${AWS_ACCESS_KEY_ID:test}
#    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
      region: ${AWS_REGION:us-east-1}
      bucket: ${AWS_S3_BUCKET:blog-images}
      access-key: ${AWS_ACCESS_KEY_ID:test}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  razorpay:
    # Razorpay keys (test keys locally, live in prod).
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    # System design practice: one monthly Razorpay plan per tier (12 / 18 / 24 attempts a month).
    practice-plan-12: ${RAZORPAY_PRACTICE_PLAN_12:}
    practice-plan-18: ${RAZORPAY_PRACTICE_PLAN_18:}
    practice-plan-24: ${RAZORPAY_PRACTICE_PLAN_24:}
    # Peer mock interviews: one monthly Razorpay plan per tier (5 / 10 interviews a month).
    interview-plan-5: ${RAZORPAY_INTERVIEW_PLAN_5:}
    interview-plan-10: ${RAZORPAY_INTERVIEW_PLAN_10:}
  premium:
    # One-time Premium passes, in rupees (charged as Razorpay orders; no dashboard plans needed).
    price-monthly: ${PREMIUM_PRICE_MONTHLY:2200}
    price-yearly: ${PREMIUM_PRICE_YEARLY:6500}
    price-lifetime: ${PREMIUM_PRICE_LIFETIME:14000}
    # Regular prices, shown crossed out next to the offer price (0 = no strikethrough). Keep them real prices.
    regular-monthly: ${PREMIUM_REGULAR_MONTHLY:2999}
    regular-yearly: ${PREMIUM_REGULAR_YEARLY:9999}
    regular-lifetime: ${PREMIUM_REGULAR_LIFETIME:19999}
  interviews:
    # Peer mock interviews are free for everyone for requests made up to this moment (launch period).
    free-until: ${INTERVIEW_FREE_UNTIL:2026-11-15T23:59:59+05:30}
    # Interviews a month included with Premium; plan price labels (the real prices live in the Razorpay plans).
    premium-monthly: ${INTERVIEW_PREMIUM_MONTHLY:6}
    price-label-5: ${INTERVIEW_PRICE_LABEL_5:₹499/month}
    price-label-10: ${INTERVIEW_PRICE_LABEL_10:₹799/month}
    # Regular price shown crossed out next to the launch price (blank = no strikethrough). Keep it the real price after the offer.
    regular-label-5: ${INTERVIEW_REGULAR_LABEL_5:₹799/month}
    regular-label-10: ${INTERVIEW_REGULAR_LABEL_10:₹1,299/month}
  practice:
    # Shown on the practice plan picker; the real prices live in the Razorpay plans.
    price-label-12: ${PRACTICE_PRICE_LABEL_12:₹499/month}
    price-label-18: ${PRACTICE_PRICE_LABEL_18:₹699/month}
    price-label-24: ${PRACTICE_PRICE_LABEL_24:₹999/month}
    # Regular prices shown crossed out next to the offer price (blank = no strikethrough).
    regular-label-12: ${PRACTICE_REGULAR_LABEL_12:₹699/month}
    regular-label-18: ${PRACTICE_REGULAR_LABEL_18:₹999/month}
    regular-label-24: ${PRACTICE_REGULAR_LABEL_24:₹1,399/month}
  admin:
    # Comma-separated emails that get ROLE_ADMIN (can publish questions). Override with ADMIN_EMAILS.
    emails: ${ADMIN_EMAILS:kaushikghosh199832@gmail.com}
  ratelimit:
    # Per-IP limit on POST /auth/** (login/register) to blunt brute-force.
    auth-max-requests: ${AUTH_RATE_LIMIT:10}
    auth-window-seconds: ${AUTH_RATE_WINDOW:60}
  jwt:
    # Required, no default: set APP_JWT_SECRET (64+ random characters) in the environment or backend/.env.
    secret: ${APP_JWT_SECRET}
    # Access token lifetime (15 min); the refresh token (APP_JWT_REFRESH_DAYS) keeps people signed in.
    access-ms: ${APP_JWT_ACCESS_MS:900000}
    refresh-days: ${APP_JWT_REFRESH_DAYS:30}
  # Sign in with Google: the OAuth client id from Google Cloud Console. Blank hides the Google button.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    # Origin patterns. Dev defaults allow any localhost / 127.0.0.1 port; set CORS_ALLOWED_ORIGINS to exact URLs in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  mail:
    from: ${MAIL_FROM:info@meetly.co.in}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  tectonic:
    # Path to the Tectonic LaTeX binary. Installed in the Docker image; locally `brew install tectonic`.
    path: ${TECTONIC_PATH:tectonic}
  digest:
    # Daily "new questions" email: one digest per day, sent at/after this local time.
    # Covers everything published since the previous digest.
    time: ${DIGEST_TIME:19:00}
    zone: ${DIGEST_ZONE:Asia/Kolkata}
#  migration:
#    json-path: ${MIGRATION_JSON_PATH:../frontend/public/questions.json}
#    batch-size: 100
  judge0:
    url: ${JUDGE0_URL}
    token: ${JUDGE0_TOKEN}