spring:
  data:
    redis:
      # Set REDIS_URL on Railway to the Redis plugin's ${{Redis.REDIS_URL}}
      url: ${REDIS_URL:redis://localhost:6379}
  datasource:
    # Built from Railway's individual Postgres variables so the URL always has the jdbc: prefix
    # (the JDBC driver rejects the raw postgresql:// DATABASE_URL) and requires SSL.
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      # Hibernate owns the schema — creates the questions table from the entity if missing (idempotent).
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.interview.backend: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

app:
  admin:
    # Comma-separated emails that get ROLE_ADMIN (can publish questions). Override with ADMIN_EMAILS.
    emails: ${ADMIN_EMAILS:kaushikghosh199832@gmail.com}
  jwt:
    # Required, no default: set APP_JWT_SECRET (64+ random characters) in the environment or backend/.env.
    secret: ${APP_JWT_SECRET}
    # Access token lifetime (15 min); the refresh token (APP_JWT_REFRESH_DAYS) keeps people signed in.
    access-ms: ${APP_JWT_ACCESS_MS:900000}
    refresh-days: ${APP_JWT_REFRESH_DAYS:30}
  # Sign in with Google: the OAuth client id from Google Cloud Console. Blank hides the Google button.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  access:
    # Free preview per topic for non-Premium readers (a count or a percentage); override with ACCESS_TEASERS.
    teasers: ${ACCESS_TEASERS:}
    # Coding problems are free; only these companies work as a filter without Premium.
    free-problem-companies: ${FREE_PROBLEM_COMPANIES:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  migration:
    json-path: ${MIGRATION_JSON_PATH:../frontend/public/questions.json}
    batch-size: 100
  s3:
    # LocalStack for local dev; override all of these in prod with real AWS values.
    endpoint: ${AWS_S3_ENDPOINT}
    public-url: ${AWS_S3_PUBLIC_URL}
    region: ${AWS_REGION}
    bucket: ${AWS_S3_BUCKET}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
  judge0:
    url: ${JUDGE0_URL}
    token: ${JUDGE0_TOKEN}