    <script>
      // The old Railway host is 301-redirected by the server, but a service worker registered on it serves the cached
      // app shell and skips that redirect until a refresh. Drop the worker and its caches, then move to the real domain.
      if (location.hostname === 'interviewreader.up.railway.app') {
        var go = function () { location.replace('https://interviewreader.cloud' + location.pathname + location.search + location.hash) }
        Promise.all([
          navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }) : 0,
          window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }) : 0,
        ]).then(go, go)
      }
    </script>
